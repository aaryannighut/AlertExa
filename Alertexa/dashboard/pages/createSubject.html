<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Subject</title>

    <!-- CSS Links -->
    <link rel="stylesheet" href="../common/css/bootstrap.min.css">
    <link rel="stylesheet" href="../common/css/animate.min.css">
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
          integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: #1e2a57;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: 600;
        }

        /* Center form container */
        .center-box {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Form box */
        .form-box {
            background-color: white;
            padding: 40px 50px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }

        /* Button */
        .subject-btn {
            background-color: #1e2a57;
            color: white;
            border-radius: 6px;
            padding: 8px 20px;
            border: none;
        }

        .subject-btn:hover {
            background-color: #162043;
        }

        /* Input */
        .form-control {
            border-radius: 6px;
            padding: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        Create Subject
    </header>

    <!-- Centered Form -->
    <div class="center-box">
        <div class="form-box">
            <form>
                <input type="text" placeholder="Subject Name" class="form-control mb-3">
                <button type="button" class="subject-btn">Store Subject</button>
            </form>
        </div>
    </div>

    <!-- JS Links -->
    <script src="../common/js/bootstrap.bundle.min.js"></script>
    <script src="../common/js/sweetalert.min.js"></script>
    <script src="new_dashboard.js"></script>
</body>
</html>
