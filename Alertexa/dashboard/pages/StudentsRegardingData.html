<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students Regarding Data</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Header */
    .header {
      background-color: #1e2a57;
      color: white;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      padding: 15px 0;
    }

    /* Subheader */
    .sub-header {
      background-color: #e9f0ff;
      color: #1e2a57;
      padding: 10px 20px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Table container */
    .table-container {
      padding: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      text-align: center;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      vertical-align: middle;
    }

    th {
      background-color: white;
      color: #333;
      font-weight: 600;
    }

    td img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .action-icons i {
      cursor: pointer;
      margin: 0 6px;
      font-size: 18px;
    }

    .action-icons .fa-trash {
      color: #dc3545;
    }

    .action-icons .fa-eye {
      color: #0d6efd;
    }

    /* Hover effects */
    .action-icons i:hover {
      transform: scale(1.2);
    }

  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    Students Regarding Data
  </div>

  <!-- Sub Header -->
  <div class="sub-header" data-bs-toggle="collapse" data-bs-target="#userData">
    All Type Of User Data 
    <i class="fa-solid fa-angle-up"></i>
  </div>

  <!-- Table Section -->
  <div id="userData" class="collapse show">
    <div class="table-container">
      <table class="table table-bordered align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>Profile</th>
            <th>Name</th>
            <th>Father's Name</th>
            <th>DOB</th>
            <th>User Type</th>
            <th>Mobile</th>
            <th>ERP No.</th>
            <th>Password</th>
            <th>Email</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1</td>
            <td><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile"></td>
            <td>Aaryan Nighut</td>
            <td>Subhash</td>
            <td>2005-07-07</td>
            <td>student</td>
            <td>9172074296</td>
            <td>230600453</td>
            <td>aaryan</td>
            <td>aaryannighut07@gmail.com</td>
            <td class="action-icons">
              <i class="fa-solid fa-trash"></i>
              <i class="fa-solid fa-eye"></i>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
