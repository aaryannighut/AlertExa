<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Subject Related Questions</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
          integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1e2a57;
            color: white;
            text-align: center;
            padding: 15px 0;
            font-size: 24px;
            font-weight: 600;
        }

        .container-box {
            background-color: white;
            max-width: 650px;
            margin: 40px auto;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        .form-label {
            font-weight: 600;
            text-align: left;
        }

        .btn-store {
            background-color: #1e2a57;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn-store:hover {
            background-color: #162043;
        }

        select, input {
            border-radius: 6px;
        }

        h5 {
            color: #1e2a57;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        Create Subject Related Questions
    </header>

    <div class="container-box">
        <h5>Create Question</h5>
        <form>
            <div class="mb-3">
                <label class="form-label">Choose Subject</label>
                <select class="form-select">
                    <option selected>Choose Subject</option>
                    <option value="AI">Artificial Intelligence</option>
                    <option value="CN">Computer Networks</option>
                    <option value="DBMS">Database Management</option>
                    <option value="Web">Web Computing</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Enter Your Question Here!</label>
                <input type="text" class="form-control" placeholder="Type your question">
            </div>

            <div class="mb-3">
                <label class="form-label">Option-1</label>
                <input type="text" class="form-control" placeholder="Enter option 1">
            </div>

            <div class="mb-3">
                <label class="form-label">Option-2</label>
                <input type="text" class="form-control" placeholder="Enter option 2">
            </div>

            <div class="mb-3">
                <label class="form-label">Option-3</label>
                <input type="text" class="form-control" placeholder="Enter option 3">
            </div>

            <div class="mb-3">
                <label class="form-label">Option-4</label>
                <input type="text" class="form-control" placeholder="Enter option 4">
            </div>

            <div class="mb-3">
                <label class="form-label">Correct Answer</label>
                <input type="text" class="form-control" placeholder="Enter correct answer">
            </div>

            <button type="button" class="btn-store">Store Question</button>
        </form>
    </div>

    <!-- JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
