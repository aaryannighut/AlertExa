<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Face Detection JS</title>
    <script defer src="https://unpkg.com/face-api.js"></script>
    <style>
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        video {
            transform: scaleX(-1); /* Mirror video like webcam */
        }
    </style>
</head>
<body>
    <video id="video" width="400" height="300" autoplay muted></video>
    <canvas id="overlay"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');

        async function startVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error accessing webcam:", err);
            }
        }

        async function loadModels() {
            await faceapi.nets.tinyFaceDetector.loadFromUri("/models");
            console.log("✅ Face API loaded");
        }

        // Merge overlapping faces
        function mergeFaces(detections, threshold = 0.5) {
            const merged = [];
            detections.forEach(det => {
                const { x, y, width: w, height: h } = det.box;
                let keep = true;
                merged.forEach(m => {
                    const xx1 = Math.max(x, m.x);
                    const yy1 = Math.max(y, m.y);
                    const xx2 = Math.min(x + w, m.x + m.w);
                    const yy2 = Math.min(y + h, m.y + m.h);
                    const interArea = Math.max(0, xx2 - xx1) * Math.max(0, yy2 - yy1);
                    const unionArea = w * h + m.w * m.h - interArea;
                    const iou = interArea / unionArea;
                    if (iou > threshold) keep = false;
                });
                if (keep) merged.push({ x, y, w, h });
            });
            return merged;
        }

        async function detectFaces() {
            const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
            const detections = await faceapi.detectAllFaces(video, options);

            // Merge duplicates
            const faces = mergeFaces(detections);

            // Resize canvas to video size
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "green";
            ctx.lineWidth = 2;
            ctx.font = "18px Arial";
            ctx.fillStyle = "red";

            faces.forEach(f => {
                ctx.strokeRect(f.x, f.y, f.w, f.h);
            });

            ctx.fillText(`Faces detected: ${faces.length}`, 10, 25);

            requestAnimationFrame(detectFaces);
        }

        video.addEventListener('play', detectFaces);

        (async function init() {
            await loadModels();
            startVideo();
        })();
    </script>
</body>
</html>
